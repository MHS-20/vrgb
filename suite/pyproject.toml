# VRGB Suite: PyQt6 GUI, tray and automation on top of VRGB Core (`vrgb`).
# Distro packages build from this; ./install.sh copies vrgb_suite/ directly.
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vrgb-suite"
dynamic = ["version"]
description = "GUI, tray and automatic backlight control for VRGB (ASUS Vivobook RGB keyboards)"
license = {text = "MIT"}
requires-python = ">=3.8"
dependencies = ["vrgb", "PyQt6"]

[project.urls]
Homepage = "https://github.com/vrgb-dev/vrgb"

[project.scripts]
vrgb-gui = "vrgb_suite.app:main"

[tool.setuptools]
packages = ["vrgb_suite"]

[tool.setuptools.dynamic]
version = {attr = "vrgb_suite.__version__"}
