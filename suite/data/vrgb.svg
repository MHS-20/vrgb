<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- VRGB app icon: a keyboard lit by an RGB gradient -->
  <defs>
    <linearGradient id="rgb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b5c"/>
      <stop offset="0.2" stop-color="#ffb02e"/>
      <stop offset="0.4" stop-color="#3ddc84"/>
      <stop offset="0.6" stop-color="#22d3ee"/>
      <stop offset="0.8" stop-color="#5b7cff"/>
      <stop offset="1" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#454b58"/>
      <stop offset="1" stop-color="#1f2229"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>
  <rect x="4" y="22" width="120" height="84" rx="16" fill="url(#body)"/>
  <rect x="14" y="32" width="100" height="64" rx="8" fill="url(#rgb)" opacity="0.35" filter="url(#glow)"/>
  <g fill="url(#rgb)">
    <rect x="14" y="32" width="16" height="16" rx="4"/>
    <rect x="35" y="32" width="16" height="16" rx="4"/>
    <rect x="56" y="32" width="16" height="16" rx="4"/>
    <rect x="77" y="32" width="16" height="16" rx="4"/>
    <rect x="98" y="32" width="16" height="16" rx="4"/>
    <rect x="14" y="56" width="24" height="16" rx="4"/>
    <rect x="43" y="56" width="16" height="16" rx="4"/>
    <rect x="64" y="56" width="16" height="16" rx="4"/>
    <rect x="85" y="56" width="29" height="16" rx="4"/>
    <rect x="14" y="80" width="16" height="16" rx="4"/>
    <rect x="35" y="80" width="58" height="16" rx="4"/>
    <rect x="98" y="80" width="16" height="16" rx="4"/>
  </g>
</svg>
